<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Login Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .page-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .page-card a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            display: block;
        }

        .page-card p {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 10px;
            font-size: 0.9em;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 0.9em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Creative Login Pages</h1>
        <p class="subtitle">A collection of modern and creative login page designs</p>

        <div class="pages-grid">
            <div class="page-card">
                <a href="LOGIN%20PAGE/index.html">
                    Login Page 1
                    <p>Creative animal themed login</p>
                </a>
            </div>

            <div class="page-card">
                <a href="Login%20form%203%20no%20validation/index.html">
                    Login Form 3
                    <p>No validation version</p>
                </a>
            </div>
        </div>

        <div class="footer">
            <p>Built with ❤️ | View on <a href="https://github.com/yogaraj121/Creative-Login-Pages" target="_blank">GitHub</a></p>
        </div>
    </div>
</body>
</html>
